name: Deploy website

on:
  push:
    branches: [next]
    paths:
      - 'website/**'
      - 'docs/site/**'
      - 'apps/devtool/**'
      - 'hosts/**'
      - 'native/host-core-wasm/**'
      - 'packages/**'
      - 'tools/cli/**'
      - 'tests/apps/demo/**'
      - 'scripts/build-site-devtool.mjs'
      - 'scripts/devtool-apps.mjs'
      - 'scripts/check-website.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site lives at https://yufji.github.io/tiny/.
      TINY_SITE_BASE: /tiny/
      TINY_SITE_URL: https://yufji.github.io/tiny/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.14.0
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build HostCore wasm
        run: pnpm --filter @tiny/host-core-wasm build
      - name: Build workspace packages
        run: pnpm build:glass-easel
      - name: Build website and embedded devtool
        run: pnpm site:build
      - name: Check website build
        run: node scripts/check-website.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
