name: Deploy website

on:
  push:
    branches: [next]
    paths:
      - 'website/**'
      - 'docs/site/**'
      - 'apps/devtool/**'
      - 'hosts/**'
      - 'native/host-core-wasm/**'
      - 'packages/**'
      - 'tools/cli/**'
      - 'tests/apps/demo/**'
      - 'scripts/build-site-devtool.mjs'
      - 'scripts/devtool-apps.mjs'
      - 'scripts/check-website.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site lives at https://yufji.github.io/tiny/.
      TINY_SITE_BASE: /tiny/
      TINY_SITE_URL: https://yufji.github.io/tiny/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.14.0
        run: |
          set -euo pipefail
          archive="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${archive}" -o "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          # Copy across filesystems: /tmp is a different device on hosted runners,
          # and a rename (what jetli/wasm-pack-action does) fails with EXDEV.
          install -m 755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build HostCore wasm
        run: pnpm --filter @tiny/host-core-wasm build
      - name: Build workspace packages
        run: pnpm build:glass-easel
      - name: Build website and embedded devtool
        run: pnpm site:build
      - name: Check website build
        run: node scripts/check-website.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
