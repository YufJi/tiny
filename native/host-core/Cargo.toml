[package]
name = "tiny-host-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-neutral host core for the Tiny mini-program engine"

[lib]
name = "tiny_host_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
