[package]
name = "tiny-host-core-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "UniFFI bindings for the Tiny Rust HostCore"

[lib]
name = "tiny_host_core_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
cli = ["uniffi/cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-host-core = { path = "../host-core" }
uniffi = { version = "0.32.2", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
