[package]
name = "tiny-host-core-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for the shared Tiny HostCore"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-host-core = { path = "../host-core" }
wasm-bindgen = "0.2"
